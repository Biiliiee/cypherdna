name: Build and Release CypherDNA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  # ============================================================
  # JOB 1: Windows — Compila .exe com PyInstaller
  # ============================================================
  build-windows:
    runs-on: windows-latest
    name: Build Windows EXE

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Healthcheck (Pre-Build)
        env:
          CPH_TEST_MODE: "true"
        run: python scripts/healthcheck_suite.py
        continue-on-error: true

      - name: Build Windows EXE
        run: python scripts/build.py

      - name: Verify & Package Windows Artifact
        run: |
          if (Test-Path "dist\cypherdna.exe") {
            Write-Host "Windows build artifact found!"
            Compress-Archive -Path "dist\cypherdna.exe" -DestinationPath "dist\cypherdna-windows.zip"
            Get-Item "dist\cypherdna-windows.zip"
          } else {
            Write-Error "Windows build artifact NOT found!"
            exit 1
          }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/cypherdna-windows.zip

  # ============================================================
  # JOB 2: Linux — Compila binário ELF com Nuitka
  # ============================================================
  build-linux:
    runs-on: ubuntu-latest
    name: Build Linux Binary

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc patchelf ccache upx libmagic1 zip

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka zstandard ordered-set

      - name: Run Healthcheck (Pre-Build)
        env:
          CPH_TEST_MODE: "true"
        run: python scripts/healthcheck_suite.py
        continue-on-error: true

      - name: Build Linux Binary with Nuitka
        run: |
          python -m nuitka \
            --onefile \
            --standalone \
            --assume-yes-for-downloads \
            --lto=yes \
            --jobs=$(nproc) \
            --onefile-tempdir-spec={TEMP}/CypherDNA_Runtime \
            --include-package=rich \
            --include-module=rich._unicode_data \
            --include-package=unidecode \
            --include-package=fpdf \
            --include-package=click \
            --include-package=requests \
            --include-data-dir=data=data \
            --output-filename=cypherdna \
            --remove-output \
            cli.py
        env:
          GITHUB_ACTIONS: "true"

      - name: Package Linux Binary
        run: |
          mkdir -p CypherDNA_Linux_Build
          cp cypherdna CypherDNA_Linux_Build/
          cp scripts/setup_kali.sh CypherDNA_Linux_Build/ 2>/dev/null || true
          cp -r data CypherDNA_Linux_Build/ 2>/dev/null || true

          # Cria o guia de uso Linux
          cat > CypherDNA_Linux_Build/GUIA_LINUX.txt << 'EOF'
          ===========================================================
                 CYPHERDNA - GUIA RAPIDO LINUX / KALI
          ===========================================================

          COMO EXECUTAR:
            1. chmod +x cypherdna
            2. ./cypherdna --help

          INSTALAR COMO COMANDO GLOBAL:
            sudo cp cypherdna /usr/local/bin/cypherdna
            cypherdna --help

          EXEMPLOS:
            ./cypherdna analyze "Admin123!"
            ./cypherdna generator "Maria" "1985" "gato" -N 5000 -L
            ./cypherdna generator "João" "2001" -N 500000 --pipe | hashcat -m 1000 hash.txt

          ===========================================================
          EOF

          zip -r cypherdna-linux.zip CypherDNA_Linux_Build/
          echo "Linux build packaged successfully!"

      - name: Verify Linux Artifact
        run: |
          if [ -f "cypherdna-linux.zip" ]; then
            echo "Linux build artifact found!"
            ls -lh cypherdna-linux.zip
          else
            echo "Linux build artifact NOT found!"
            exit 1
          fi

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: cypherdna-linux.zip

  # ============================================================
  # JOB 3: Release — Publica ambos os artefatos
  # ============================================================
  release:
    runs-on: ubuntu-latest
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: ./artifacts/windows

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: ./artifacts/linux

      - name: Determine Release Tag
        id: tagger
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            TAG="manual-${{ github.run_number }}"
            git tag "$TAG"
            git push origin "$TAG"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagger.outputs.tag }}
          files: |
            artifacts/windows/cypherdna-windows.zip
            artifacts/linux/cypherdna-linux.zip
          name: "CypherDNA ${{ steps.tagger.outputs.tag }}"
          body: |
            ## CypherDNA ${{ steps.tagger.outputs.tag }}

            Advanced Password DNA Sequencing & Intelligent Wordlist Generator.

            ### Downloads

            | Platform | File | Notes |
            |----------|------|-------|
            | **Windows** | `cypherdna-windows.zip` | Extract & run `cypherdna.exe` |
            | **Linux / Kali** | `cypherdna-linux.zip` | `chmod +x cypherdna && ./cypherdna` |

            ### Quick Start (Linux/Kali)
            ```bash
            unzip cypherdna-linux.zip
            cd CypherDNA_Linux_Build
            chmod +x cypherdna
            sudo cp cypherdna /usr/local/bin/cypherdna
            cypherdna --help
            ```
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cypherdna"
version = "3.5.1"
description = "Advanced Password DNA Sequencing & Intelligent Wordlist Generator"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Gustavo"}
]
keywords = ["password", "wordlist", "forensics", "pentesting", "cybersecurity"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

dependencies = [
  "rich>=13.0",
  "click>=8.0",
  "unidecode>=1.3",
  "fpdf2>=2.7",
  "requests>=2.28",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[project.scripts]
cypherdna = "cli:cli"

[tool.setuptools]
packages = ["core", "core.commands"]
py-modules = ["cli"]

[tool.setuptools.package-data]
"*" = ["data/**/*", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "core"]
python_files = ["test_*.py"]

